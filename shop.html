<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse all everyday essentials from NOVA."
    />
    <title>Shop All Products | NOVA</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header id="navbar" class="navbar">
      <nav class="nav-container" aria-label="Main navigation">
        <a href="index.html" class="logo">NOVA</a>
        <div class="desktop-menu">
          <a href="index.html#home">Home</a>
          <a href="shop.html" aria-current="page">Shop</a>
          <a href="index.html#categories">Categories</a>
          <a href="index.html#deals">Deals</a>
        </div>
        <div class="nav-actions">
          <button
            class="nav-action"
            type="button"
            aria-label="Search products"
            onclick="window.location.href = 'index.html#products'"
          >
            &#128269;
          </button>
          <button
            class="nav-action"
            type="button"
            aria-label="Wishlist"
            onclick="window.location.href = 'wishlist.html'"
          >
            &#9825;
          </button>
          <button
            class="nav-action cart-button"
            id="shopCartBtn"
            type="button"
            aria-label="Shopping cart"
          >
            &#128722;<span class="cart-count" id="shopCartCount">0</span>
          </button>
        </div>
        <button
          class="mobile-menu-button"
          id="shopMenuButton"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
        >
          &#9776;
        </button>
      </nav>
      <div class="mobile-menu" id="shopMobileMenu">
        <a href="index.html#home">Home</a>
        <a href="shop.html" aria-current="page">Shop</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#deals">Deals</a>
        <div class="mobile-actions">
          <button
            type="button"
            onclick="window.location.href = 'index.html#products'"
          >
            &#128269; Search
          </button>
          <button
            type="button"
            onclick="window.location.href = 'wishlist.html'"
          >
            &#9825; Wishlist
          </button>
          <button id="shopMobileCartBtn" type="button">&#128722; Cart</button>
        </div>
      </div>
    </header>

    <main>
      <section class="products" aria-labelledby="shop-title">
        <div class="section-heading">
          <div>
            <span>THE NOVA COLLECTION</span>
            <h1 id="shop-title">All products</h1>
            <p class="shop-description">
              Everyday essentials, all in one place.
            </p>
          </div>
        </div>

        <div id="shopProductGrid" class="product-grid" aria-live="polite"></div>
      </section>
    </main>

    <div class="cart-overlay" id="shopCartOverlay" aria-hidden="true">
      <aside class="cart-drawer" aria-label="Shopping cart">
        <div class="cart-header">
          <div>
            <span>YOUR BAG</span>
            <h2>Shopping Cart</h2>
          </div>
          <button id="shopCloseCart" type="button" aria-label="Close cart">
            &#10005;
          </button>
        </div>
        <div class="cart-items" id="shopCartItems"></div>
        <div class="empty-cart" id="shopEmptyCart">
          <div class="empty-cart-icon">&#128722;</div>
          <h3>Your cart is empty</h3>
          <p>Looks like you haven't added anything yet.</p>
          <button id="shopStartShopping" type="button">
            Start Shopping &#8594;
          </button>
        </div>
        <div class="cart-footer hidden" id="shopCartFooter">
          <div class="cart-summary">
            <span>Subtotal</span><strong id="shopCartSubtotal">₹0</strong>
          </div>
          <p class="cart-note">Taxes and delivery calculated at checkout.</p>
          <button class="checkout-btn" id="shopCheckoutBtn" type="button">
            Proceed to Checkout &#8594;
          </button>
        </div>
      </aside>
    </div>

    <script src="./js/products.js"></script>
    <script>
      const shopProductGrid = document.getElementById("shopProductGrid");
      let shopCart = JSON.parse(localStorage.getItem("novaCart") || "[]");

      products.forEach((product) => {
        const card = document.createElement("article");
        card.className = "product-card";
        card.dataset.productId = product.id;
        card.innerHTML = `
          <div class="product-image shop-card-image">
            <a class="shop-product-link" href="product.html?id=${product.id}" aria-label="View ${product.name}">
              <img src="${product.image}" alt="${product.name}" loading="lazy" />
              <span class="product-badge">${product.badge}</span>
            </a>
            <button class="product-wishlist" type="button" aria-label="Add ${product.name} to wishlist" aria-pressed="false">&#9825;</button>
          </div>
          <div class="product-info">
              <span class="product-category">${product.category}</span>
              <h2 class="product-name"><a class="shop-product-link" href="product.html?id=${product.id}">${product.name}</a></h2>
              <div class="product-bottom">
                <span class="product-price">₹${product.price}</span>
                <button class="add-to-cart" type="button" data-product-id="${product.id}">Add to cart</button>
              </div>
          </div>`;
        shopProductGrid.appendChild(card);
      });

      function syncShopWishlist() {
        const saved = JSON.parse(localStorage.getItem("novaWishlist") || "[]");
        shopProductGrid.querySelectorAll(".product-card").forEach((card) => {
          const button = card.querySelector(".product-wishlist");
          const productId = Number(card.dataset.productId);
          const isSaved = saved.includes(productId);
          button.innerHTML = isSaved ? "&#9829;" : "&#9825;";
          button.classList.toggle("liked", isSaved);
          button.setAttribute("aria-pressed", String(isSaved));
        });
      }

      shopProductGrid.addEventListener("click", (event) => {
        const cartButton = event.target.closest(".add-to-cart");
        if (cartButton) {
          const productId = Number(cartButton.dataset.productId);
          const cart = JSON.parse(localStorage.getItem("novaCart") || "[]");
          const existingItem = cart.find((item) => item.id === productId);
          if (existingItem) existingItem.quantity += 1;
          else cart.push({ id: productId, quantity: 1 });
          localStorage.setItem("novaCart", JSON.stringify(cart));
          shopCart = cart;
          renderShopCart();
          const originalText = cartButton.textContent;
          cartButton.textContent = "Added!";
          cartButton.classList.add("added");
          window.setTimeout(() => {
            cartButton.textContent = originalText;
            cartButton.classList.remove("added");
          }, 1200);
          return;
        }

        const button = event.target.closest(".product-wishlist");
        if (!button) return;
        event.preventDefault();
        event.stopPropagation();
        const productId = Number(
          button.closest(".product-card").dataset.productId,
        );
        const saved = JSON.parse(localStorage.getItem("novaWishlist") || "[]");
        const updated = saved.includes(productId)
          ? saved.filter((savedId) => savedId !== productId)
          : [...saved, productId];
        localStorage.setItem("novaWishlist", JSON.stringify(updated));
        syncShopWishlist();
      });

      syncShopWishlist();
      window.addEventListener("pageshow", syncShopWishlist);

      function renderShopCart() {
        shopCart = JSON.parse(localStorage.getItem("novaCart") || "[]");
        document.getElementById("shopCartCount").textContent = shopCart.reduce(
          (sum, item) => sum + item.quantity,
          0,
        );
        const itemsNode = document.getElementById("shopCartItems");
        const emptyNode = document.getElementById("shopEmptyCart");
        const footerNode = document.getElementById("shopCartFooter");
        itemsNode.innerHTML = "";
        emptyNode.classList.toggle("hidden", shopCart.length > 0);
        footerNode.classList.toggle("hidden", shopCart.length === 0);
        let subtotal = 0;
        shopCart.forEach((item) => {
          const product = products.find((entry) => entry.id === item.id);
          if (!product) return;
          subtotal += product.price * item.quantity;
          const row = document.createElement("div");
          row.className = "cart-item";
          row.innerHTML = `
            <div class="cart-item-image"><img src="${product.image}" alt="${product.name}"></div>
            <div class="cart-item-info">
              <span class="cart-item-category">${product.category}</span>
              <h3 class="cart-item-name">${product.name}</h3>
              <span class="cart-item-price">₹${product.price}</span>
              <div class="cart-item-bottom">
                <div class="quantity-controls">
                  <button type="button" data-cart-action="decrease" data-id="${product.id}" aria-label="Decrease ${product.name} quantity">−</button>
                  <span>${item.quantity}</span>
                  <button type="button" data-cart-action="increase" data-id="${product.id}" aria-label="Increase ${product.name} quantity">+</button>
                </div>
                <button class="remove-item" type="button" data-cart-action="remove" data-id="${product.id}">Remove</button>
              </div>
            </div>`;
          itemsNode.appendChild(row);
        });
        document.getElementById("shopCartSubtotal").textContent =
          `₹${subtotal}`;
      }

      function openShopCart() {
        renderShopCart();
        const overlay = document.getElementById("shopCartOverlay");
        overlay.classList.add("active");
        overlay.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeShopCart() {
        const overlay = document.getElementById("shopCartOverlay");
        overlay.classList.remove("active");
        overlay.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      document
        .getElementById("shopCartBtn")
        .addEventListener("click", openShopCart);
      document
        .getElementById("shopMobileCartBtn")
        .addEventListener("click", () => {
          document.getElementById("shopMobileMenu").classList.remove("active");
          document
            .getElementById("shopMenuButton")
            .setAttribute("aria-expanded", "false");
          openShopCart();
        });
      document
        .getElementById("shopCloseCart")
        .addEventListener("click", closeShopCart);
      document
        .getElementById("shopCartOverlay")
        .addEventListener("click", (event) => {
          if (event.target.id === "shopCartOverlay") closeShopCart();
        });
      document
        .getElementById("shopCartItems")
        .addEventListener("click", (event) => {
          const control = event.target.closest("[data-cart-action]");
          if (!control) return;
          const id = Number(control.dataset.id);
          if (control.dataset.cartAction === "remove") {
            shopCart = shopCart.filter((item) => item.id !== id);
          } else {
            const item = shopCart.find((entry) => entry.id === id);
            if (item)
              item.quantity +=
                control.dataset.cartAction === "increase" ? 1 : -1;
            shopCart = shopCart.filter((entry) => entry.quantity > 0);
          }
          localStorage.setItem("novaCart", JSON.stringify(shopCart));
          renderShopCart();
        });
      document
        .getElementById("shopStartShopping")
        .addEventListener("click", closeShopCart);
      document
        .getElementById("shopCheckoutBtn")
        .addEventListener("click", () => {
          if (shopCart.length) window.location.href = "checkout.html";
        });
      window.addEventListener("storage", renderShopCart);
      renderShopCart();

      const menuButton = document.getElementById("shopMenuButton");
      const mobileMenu = document.getElementById("shopMobileMenu");
      menuButton.addEventListener("click", () => {
        const isOpen = mobileMenu.classList.toggle("active");
        menuButton.setAttribute("aria-expanded", String(isOpen));
        menuButton.innerHTML = isOpen ? "&#10005;" : "&#9776;";
      });
    </script>
    <style>
      .shop-description {
        margin-top: 18px;
        color: #53615b;
        line-height: 1.6;
      }

      .shop-product-link {
        display: block;
        color: inherit;
        text-decoration: none;
      }

      .shop-card-image > .shop-product-link {
        position: absolute;
        inset: 0;
      }

      .shop-card-image img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .shop-card-image .product-wishlist {
        z-index: 3;
      }
    </style>
  </body>
</html>
